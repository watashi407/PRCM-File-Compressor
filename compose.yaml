services:
  compressor:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PUBLIC_HOSTNAME: ${PUBLIC_HOSTNAME:?Set the compression server public hostname}
      FRONTEND_ORIGINS: https://prcm-file-compressor.vercel.app
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
